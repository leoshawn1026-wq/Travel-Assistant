<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上班摸鱼大转盘 🌀</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #F0F2F5 0%, #E8EBF0 40%, #E2E5EA 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  /* ===== Office Desk Scene ===== */
  .desk-surface {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 14vh;
    background: linear-gradient(180deg, #D8DCE3 0%, #C8CCD4 100%);
    border-top: 1px solid rgba(255,255,255,0.6);
    z-index: 0;
  }
  .desk-surface::before {
    content: '';
    position: absolute;
    top: -6px; left: 5%; right: 5%;
    height: 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.04), transparent);
    border-radius: 50%;
    filter: blur(4px);
  }

  /* ===== Background Decorations ===== */
  .deco {
    position: fixed;
    z-index: 0;
    opacity: 0.25;
    pointer-events: none;
  }

  /* Monitor silhouette - left */
  .deco-monitor {
    left: 6%; top: 12%;
    width: 200px; height: 140px;
    border: 2px solid rgba(0,0,0,0.08);
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(200,204,212,0.3));
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }
  .deco-monitor::after {
    content: '';
    position: absolute;
    bottom: -14px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 14px;
    background: rgba(0,0,0,0.06);
    border-radius: 0 0 3px 3px;
  }

  /* Plant - right */
  .deco-plant {
    right: 7%; bottom: 18vh;
    font-size: 64px;
    opacity: 0.2;
    filter: grayscale(0.3);
  }

  /* Coffee cup - small */
  .deco-coffee {
    right: 14%; top: 22%;
    font-size: 36px;
    opacity: 0.15;
  }

  /* Subtle grid pattern overlay */
  .bg-pattern {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.03;
    background-image:
      linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* ===== Ambient Light ===== */
  .ambient-light {
    position: fixed;
    top: -30%; left: -10%;
    width: 60%; height: 80%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.5) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== Main Card ===== */
  .main-card {
    position: relative;
    z-index: 1;
    width: 780px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    box-shadow:
      0 25px 60px rgba(0,0,0,0.08),
      0 8px 20px rgba(0,0,0,0.04),
      inset 0 1px 0 rgba(255,255,255,0.8);
    padding: 40px 48px 44px;
    border: 1px solid rgba(255,255,255,0.5);
    transition: box-shadow 0.3s;
  }
  .main-card:hover {
    box-shadow:
      0 30px 70px rgba(0,0,0,0.10),
      0 10px 24px rgba(0,0,0,0.05),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #4A90D9, #357ABD);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 10px rgba(74,144,217,0.25);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #1A1D24;
  }
  .header h1 span {
    background: linear-gradient(135deg, #D4A017, #C28B6B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-badge {
    font-size: 12px;
    color: #8E95A2;
    background: rgba(0,0,0,0.04);
    padding: 5px 14px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    border: 1px solid rgba(0,0,0,0.04);
  }

  /* ===== Subtitle ===== */
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #9CA3B0;
    letter-spacing: 2px;
    margin-bottom: 24px;
    font-weight: 400;
  }
  .subtitle i {
    font-style: normal;
    display: inline-block;
    animation: subtleFloat 3s ease-in-out infinite;
  }

  @keyframes subtleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* ===== Wheel Container ===== */
  .wheel-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .wheel-container {
    position: relative;
    width: 560px;
    height: 560px;
    flex-shrink: 0;
  }

  /* Pointer triangle */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0; height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 30px solid #E84C3D;
    filter: drop-shadow(0 3px 6px rgba(232,76,61,0.4));
  }
  .pointer::after {
    content: '';
    position: absolute;
    top: -34px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    background: #E84C3D;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(232,76,61,0.3);
  }

  /* Outer ring decoration */
  .wheel-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E8EBF0, #D5D8DE);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.06),
      0 6px 24px rgba(0,0,0,0.10);
    z-index: 0;
  }
  .wheel-ring-inner {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F5F6FA, #EAECF0);
    z-index: 1;
  }

  /* Canvas */
  #wheelCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    border-radius: 50%;
    transition: none;
    will-change: transform;
  }

  /* Center Golden Button */
  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(145deg, #FDE8A0 0%, #E8B830 40%, #D4A017 70%, #B8860B 100%);
    box-shadow:
      0 4px 16px rgba(212,160,23,0.4),
      inset 0 2px 0 rgba(255,255,255,0.5),
      inset 0 -2px 0 rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    color: #7A4E00;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 1.2;
    padding-top: 2px;
  }
  .center-btn::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    pointer-events: none;
  }
  .center-btn:hover {
    transform: translate(-50%, -50%) scale(1.05);
    box-shadow:
      0 6px 24px rgba(212,160,23,0.5),
      inset 0 2px 0 rgba(255,255,255,0.5),
      inset 0 -2px 0 rgba(0,0,0,0.1);
  }
  .center-btn:active {
    transform: translate(-50%, -50%) scale(0.96);
  }
  .center-btn .icon {
    font-size: 20px;
    line-height: 1;
    margin-bottom: 1px;
  }
  .center-btn .label {
    font-size: 10px;
    opacity: 0.8;
  }

  /* ===== Spin Button ===== */
  .spin-btn {
    position: relative;
    width: 280px;
    height: 56px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow:
      0 6px 20px rgba(74,144,217,0.30),
      inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: inherit;
  }
  .spin-btn::before {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
    pointer-events: none;
  }
  .spin-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 10px 30px rgba(74,144,217,0.35),
      inset 0 1px 0 rgba(255,255,255,0.2);
    background: linear-gradient(135deg, #5A9FE8 0%, #3B82D4 100%);
  }
  .spin-btn:active {
    transform: translateY(1px);
    box-shadow:
      0 3px 12px rgba(74,144,217,0.30),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .spin-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
  }
  .spin-btn .arrow {
    display: inline-block;
    transition: transform 0.3s;
  }
  .spin-btn:hover .arrow {
    transform: rotate(180deg);
  }

  /* ===== Footer Info ===== */
  .footer-info {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: #B0B7C4;
    letter-spacing: 1px;
  }

  /* ===== Result Modal ===== */
  .result-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
  }
  .result-overlay.show {
    display: flex;
  }

  .result-card {
    background: #fff;
    border-radius: 28px;
    padding: 44px 52px 38px;
    max-width: 440px;
    width: 90%;
    text-align: center;
    box-shadow: 0 40px 80px rgba(0,0,0,0.15);
    animation: bounceIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #4A90D9, #D4A017, #C28B9E);
  }

  .result-emoji {
    font-size: 52px;
    margin-bottom: 12px;
    display: block;
  }
  .result-label {
    font-size: 14px;
    color: #9CA3B0;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .result-text {
    font-size: 32px;
    font-weight: 700;
    color: #1A1D24;
    margin-bottom: 6px;
  }
  .result-hint {
    font-size: 14px;
    color: #B0B7C4;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .result-close-btn {
    padding: 12px 40px;
    border: none;
    border-radius: 12px;
    background: #F0F2F5;
    color: #4A5568;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  .result-close-btn:hover {
    background: #E2E5EA;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes bounceIn {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ===== Responsive ===== */
  @media (max-width: 860px) {
    .main-card { width: 94vw; padding: 28px 20px 32px; }
    .wheel-container { width: min(70vw, 70vw); height: min(70vw, 70vw); }
    .header h1 { font-size: 18px; }
    .header-badge { display: none; }
    .spin-btn { width: 220px; height: 50px; font-size: 16px; }
    .center-btn { width: 64px; height: 64px; font-size: 11px; }
    .deco-monitor, .deco-plant, .deco-coffee { display: none; }
    .result-card { padding: 32px 24px 30px; }
    .result-text { font-size: 26px; }
  }

  @media (max-width: 480px) {
    .main-card { padding: 20px 14px 24px; border-radius: 24px; }
    .wheel-container { width: min(84vw, 84vw); height: min(84vw, 84vw); }
    .header h1 { font-size: 16px; }
    .spin-btn { width: 180px; height: 44px; font-size: 14px; border-radius: 11px; }
    .center-btn { width: 54px; height: 54px; font-size: 10px; }
    .center-btn .icon { font-size: 16px; }
    .center-btn .label { display: none; }
    .pointer { border-left-width: 14px; border-right-width: 14px; border-top-width: 22px; top: -10px; }
    .subtitle { font-size: 11px; }
  }
</style>
</head>
<body>

  <!-- ===== Desktop Scene Elements ===== -->
  <div class="bg-pattern"></div>
  <div class="ambient-light"></div>

  <div class="deco deco-monitor"></div>
  <div class="deco deco-plant">🌿</div>
  <div class="deco deco-coffee">☕</div>

  <div class="desk-surface"></div>

  <!-- ===== Main Card ===== -->
  <div class="main-card">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="header-icon">🌀</div>
        <h1>上班<span>摸鱼</span>大转盘</h1>
      </div>
      <div class="header-badge">✦ 今日宜摸鱼</div>
    </div>

    <div class="subtitle">
      <i>💼</i> &nbsp;命运之轮即将转动，看看今天摸鱼的正确姿势&nbsp; <i>🎯</i>
    </div>

    <!-- Wheel -->
    <div class="wheel-wrapper">
      <div class="wheel-container">
        <div class="wheel-ring">
          <div class="wheel-ring-inner"></div>
        </div>
        <canvas id="wheelCanvas" width="560" height="560"></canvas>
        <button class="center-btn" id="centerBtn" title="点击转动">
          <span class="icon">🎰</span>
          <span class="label">GO</span>
        </button>
        <div class="pointer"></div>
      </div>

      <!-- Spin Button -->
      <button class="spin-btn" id="spinBtn">
        <span class="arrow">➤</span> 一键转动
      </button>
    </div>

    <div class="footer-info">⚡ 每天转三次，干活更有劲</div>
  </div>

  <!-- ===== Result Modal ===== -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <span class="result-emoji" id="resultEmoji">🎉</span>
      <div class="result-label">今天你的任务是</div>
      <div class="result-text" id="resultText">带薪上厕所</div>
      <div class="result-hint" id="resultHint">恭喜！这是一项光荣的使命 🫡</div>
      <button class="result-close-btn" id="resultCloseBtn">好的，开冲！</button>
    </div>
  </div>

  <script>
    // ===== Data =====
    const SEGMENTS = [
      { text: '起身喝水',   color: '#4A90D9' },
      { text: '下楼抽烟',   color: '#5B9E8F' },
      { text: '带薪上厕所', color: '#D4A06A' },
      { text: '窗边透气',   color: '#C28B9E' },
      { text: '楼下买奶茶', color: '#6BA3C9' },
      { text: '工位发呆',   color: '#D4B84C' },
      { text: '远眺放松',   color: '#8FBC8F' },
      { text: '走廊散步',   color: '#C98686' },
      { text: '拉伸活动',   color: '#7EA8D4' },
      { text: '接水摸鱼',   color: '#D4A84B' },
      { text: '短途闲逛',   color: '#8FB5AD' },
      { text: '静坐摸鱼',   color: '#BDA0CB' },
    ];

    // Fun emoji per activity
    const EMOJIS = [
      '🚰', '🚬', '🚽', '🪟', '🧋', '😶', '🌄', '🚶', '🧘', '💧', '🚶‍♂️', '🧘‍♀️'
    ];

    const HINTS = [
      '补充水分，活力满满！',
      '尼古丁时刻，优雅摸鱼',
      '带薪蹲坑，人生巅峰',
      '呼吸新鲜空气，远离PM2.5',
      '奶茶续命，甜度拉满',
      '放空大脑，重启人生',
      '眺望远方，预防近视',
      '日行万步，从走廊开始',
      '拉伸一下，告别颈椎病',
      '接水是假，摸鱼是真',
      '短途旅行，工位周边游',
      '静坐冥想，禅意摸鱼',
    ];

    // ===== Canvas Setup =====
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const CX = W / 2;
    const CY = H / 2;
    const RADIUS = 262;
    const SEG_COUNT = 12;
    const SEG_ANGLE = (2 * Math.PI) / SEG_COUNT;

    let currentAngle = 0;  // degrees
    let spinning = false;

    // ===== Draw Wheel =====
    function drawWheel() {
      ctx.clearRect(0, 0, W, H);

      // Outer decorative ring
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS + 6, 0, 2 * Math.PI);
      ctx.shadowColor = 'rgba(0,0,0,0.08)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#F5F6FA';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS + 2, 0, 2 * Math.PI);
      ctx.shadowColor = 'rgba(0,0,0,0.04)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();

      // Draw segments — start from top (12 o'clock)
      for (let i = 0; i < SEG_COUNT; i++) {
        const startAngle = -Math.PI / 2 + i * SEG_ANGLE;
        const endAngle = -Math.PI / 2 + (i + 1) * SEG_ANGLE;

        // Draw segment
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, RADIUS, startAngle, endAngle);
        ctx.closePath();

        // Subtle gradient for each segment (flat-style with tiny highlight)
        const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, RADIUS);
        grad.addColorStop(0, lightenColor(SEGMENTS[i].color, 25));
        grad.addColorStop(1, SEGMENTS[i].color);
        ctx.fillStyle = grad;
        ctx.fill();

        // Segment border
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Draw text
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(startAngle + SEG_ANGLE / 2);

        // Text shadow for readability
        ctx.shadowColor = 'rgba(0,0,0,0.15)';
        ctx.shadowBlur = 4;

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 15px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const textRadius = RADIUS * 0.62;
        ctx.fillText(SEGMENTS[i].text, textRadius, 0);

        // Draw a small dot at the outer edge for decoration
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(RADIUS - 14, 0, 3.5, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fill();

        ctx.restore();
      }

      // Inner ring (shadow beneath center button)
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, 48, 0, 2 * Math.PI);
      ctx.shadowColor = 'rgba(0,0,0,0.08)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#F0F2F5';
      ctx.fill();
      ctx.restore();
    }

    // ===== Helper: Lighten Color =====
    function lightenColor(hex, percent) {
      const num = parseInt(hex.slice(1), 16);
      const r = Math.min(255, (num >> 16) + percent);
      const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
      const b = Math.min(255, (num & 0x0000FF) + percent);
      return `rgb(${r},${g},${b})`;
    }

    // ===== Update Wheel Rotation =====
    function updateWheel(deg) {
      canvas.style.transform = `rotate(${deg}deg)`;
    }

    // ===== Get Result Index =====
    // Segments start at top (12 o'clock), going clockwise.
    // CSS rotate(positive) turns the canvas clockwise.
    // At rotation=0, segment 0 is at top.
    // At rotation=30°, the canvas has rotated 30° clockwise,
    //   so the top pointer now lands on segment 11.
    // General formula: resultIdx = floor((360 - norm) / 30) % 12
    function getResultIndex(deg) {
      const norm = ((deg % 360) + 360) % 360;
      return Math.floor(((360 - norm) % 360) / 30) % 12;
    }

    // ===== Spin Logic =====
    function spin() {
      if (spinning) return;
      spinning = true;
      document.getElementById('spinBtn').disabled = true;

      // Pick a random target segment + offset within it (avoid edges)
      const targetSeg = Math.floor(Math.random() * 12);
      const offsetInSeg = 5 + Math.random() * 20;
      // The rotation angle (0-360) that puts the target at the pointer:
      // targetNorm = (360 - (targetSeg * 30 + offsetInSeg)) % 360
      const targetNorm = ((360 - (targetSeg * 30 + offsetInSeg)) % 360 + 360) % 360;

      const currentNorm = ((currentAngle % 360) + 360) % 360;
      let additional = targetNorm - currentNorm;
      if (additional < 0) additional += 360;

      const fullSpins = 360 * (5 + Math.floor(Math.random() * 4)); // 5-8 full rotations
      const totalRotation = fullSpins + additional;

      const startAngle = currentAngle;
      const endAngle = startAngle + totalRotation;
      const duration = 4500 + Math.random() * 2000; // 4.5-6.5s
      const startTime = performance.now();

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Cubic ease-out
        const eased = 1 - Math.pow(1 - progress, 3.5);

        currentAngle = startAngle + (endAngle - startAngle) * eased;
        updateWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentAngle = endAngle;
          updateWheel(currentAngle);
          spinning = false;
          document.getElementById('spinBtn').disabled = false;

          const idx = getResultIndex(currentAngle);
          showResult(idx, currentAngle);
        }
      }

      requestAnimationFrame(animate);
    }

    // ===== Show Result =====
    let lastResultIdx = -1;

    function showResult(idx, angle) {
      // Extra check: ensure result is stable by looking at the angle
      const resultIdx = getResultIndex(angle);
      lastResultIdx = resultIdx;

      const seg = SEGMENTS[resultIdx];
      const emoji = EMOJIS[resultIdx];
      const hint = HINTS[resultIdx];

      document.getElementById('resultEmoji').textContent = emoji;
      document.getElementById('resultText').textContent = seg.text;
      document.getElementById('resultHint').textContent = hint;
      document.getElementById('resultOverlay').classList.add('show');
    }

    // ===== Close Result =====
    document.getElementById('resultCloseBtn').addEventListener('click', () => {
      document.getElementById('resultOverlay').classList.remove('show');
    });
    document.getElementById('resultOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('resultOverlay')) {
        document.getElementById('resultOverlay').classList.remove('show');
      }
    });

    // ===== Event Listeners =====
    document.getElementById('spinBtn').addEventListener('click', spin);
    document.getElementById('centerBtn').addEventListener('click', spin);

    // Keyboard shortcut: Space to spin
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat &&
          !document.getElementById('resultOverlay').classList.contains('show')) {
        e.preventDefault();
        spin();
      }
    });

    // ===== Initial Draw =====
    drawWheel();
    updateWheel(0);

    // ===== Handle Canvas/DPR for sharp rendering =====
    // Already at 560x560 native, displayed at 560x560
    // For 2K screens, this looks crisp

    console.log('🔄 摸鱼大转盘已加载 — 祝摸鱼愉快！');
  </script>
